<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾径 · Wordloom</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1100px 640px at 50% 32%, #131c3e 0%, #0b1020 70%);
    color: #dfe7ff; font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card {
    width: min(520px, 90vw); padding: 40px 36px; text-align: center;
    background: rgba(16, 22, 44, 0.86); border: 1px solid rgba(140, 165, 255, 0.18);
    border-radius: 20px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
  }
  h1 {
    margin: 0 0 6px; font-size: 34px; letter-spacing: 6px;
    background: linear-gradient(90deg, #6cd0ff, #b18cff, #ffcf4d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0 0 26px; color: #8b96b8; font-size: 13px; letter-spacing: 2px; }
  .btn {
    display: inline-block; padding: 13px 42px; border-radius: 12px; text-decoration: none;
    font-size: 18px; letter-spacing: 2px; color: #fff;
    background: linear-gradient(135deg, #24457c, #3b2a6e);
    border: 1px solid rgba(140, 165, 255, 0.5);
  }
  .btn:hover { filter: brightness(1.2); }
  .hint { margin: 22px 0 0; color: #5f6a88; font-size: 12px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <h1>拾径</h1>
    <p class="sub">WORDLOOM · 在词与线的星座间行走</p>
    <a class="btn" href="./rw/">开始游走 ▸</a>
    <p class="hint">Pico Neo3 浏览器打开本页，戴上头显后点 <b>ENTER VR</b><br>桌面浏览器可直接预览（无 VR）</p>
  </div>
</body>
</html>
